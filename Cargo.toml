[workspace]
resolver = "2"
members = [
    "crates/openstage-express-core",
    "crates/openstage-express-export",
    "crates/openstage-express-windows",
    "crates/openstage-express-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["OpenStage Capture Express contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
png = "0.17"
base64 = "0.22"
sha2 = "0.10"
flate2 = "1"
crc32fast = "1"
# OpenStage Capture's crates, read through a path link to the sibling openstage-author folder (see README).
openstage-capture-project = { path = "../openstage-author/capture/crates/openstage-capture-project" }
openstage-capture-render = { path = "../openstage-author/capture/crates/openstage-capture-render" }
# Windows Graphics Capture (the display frames behind the frame ring), reached through its Platform and FrameSource traits. The
# hooks and the field reading are Express's own, so that no typed character ever leaves the keyboard hook (spec 8.4).
openstage-capture-windows = { path = "../openstage-author/capture/crates/openstage-capture-windows" }

# Pictures are big, so tests that draw and export them run far faster with a little optimisation.
[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
