[package]
name = "openstage-express-app"
description = "The program openstage-capture-express.exe: the window, the capture bar and the editor."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "openstage-capture-express"
path = "src/main.rs"

[dependencies]
openstage-express-core = { path = "../openstage-express-core" }
openstage-express-export = { path = "../openstage-express-export" }
openstage-capture-render.workspace = true
png.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "wgpu"] }

[target.'cfg(windows)'.dependencies]
openstage-express-windows = { path = "../openstage-express-windows" }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
