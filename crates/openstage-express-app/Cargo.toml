[package]
name = "openstage-express-app"
description = "The program openstage-capture-express.exe: the window, the capture bar and the editor."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "openstage_express_app"
path = "src/lib.rs"

[[bin]]
name = "openstage-capture-express"
path = "src/main.rs"

[[bin]]
name = "openstage-capture-express-cli"
path = "src/cli.rs"

[dependencies]
openstage-express-core = { path = "../openstage-express-core" }
openstage-express-export = { path = "../openstage-express-export" }
openstage-capture-render.workspace = true
png.workspace = true
base64.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "wgpu"] }

[target.'cfg(windows)'.dependencies]
openstage-express-windows = { path = "../openstage-express-windows" }

[dev-dependencies]
openstage-capture-project.workspace = true
tempfile.workspace = true
